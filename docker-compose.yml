version: '3.8'

services:
  kafka-1:
    image: bitnami/kafka:3.9.0-debian-12-r13
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "cluster-1"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9090,CONTROLLER://:9091, EXTERNAL://:9092,PLAINTEXT_HOST://:29092" # внутренняя настройка
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9090,EXTERNAL://localhost:9092,PLAINTEXT_HOST://kafka-1:29092" # внешняя настройка
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka1-data:/bitnami/kafka
  #    networks:
  #      - kafka-net
  #
  kafka-2:
    image: bitnami/kafka:3.9.0-debian-12-r13
    container_name: kafka-2
    ports:
      - "9094:9094"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "cluster-1"
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9090,CONTROLLER://:9091, EXTERNAL://:9094,PLAINTEXT_HOST://:29092" # внутренняя настройка
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9090,EXTERNAL://localhost:9094,PLAINTEXT_HOST://kafka-2:29092" # внешняя настройка
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka2-data:/bitnami/kafka
  #    networks:
  #      - kafka-net
  #
  kafka-3:
    image: bitnami/kafka:3.9.0-debian-12-r13
    container_name: kafka-3
    ports:
      - "9096:9096"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "cluster-1"
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9090,CONTROLLER://:9091, EXTERNAL://:9096,PLAINTEXT_HOST://:29092" # внутренняя настройка
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9090,EXTERNAL://localhost:9096,PLAINTEXT_HOST://kafka-3:29092" # внешняя настройка
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka3-data:/bitnami/kafka
  #    networks:
  #      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
#    networks:
#      - kafka-net

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:

#networks:
#  kafka-net:
