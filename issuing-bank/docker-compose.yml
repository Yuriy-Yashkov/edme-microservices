version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: issuing-bank-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.4
    container_name: issuing-bank-redis_cache
    ports:
      - "6380:6379"

volumes:
  postgres_data:
